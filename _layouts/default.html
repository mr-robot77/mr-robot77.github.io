<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0E1630">
    {% seo %}
    <link rel="preload" href="{{ "/assets/fonts/fraunces-600-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ "/assets/fonts/ibm-plex-sans-400-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ "/assets/fonts/ibm-plex-mono-400-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
  </head>
  <body id="top">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      {% include header.html %}
      <main id="main">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    {% if page.chart %}
    <script src="{{ "/assets/js/hero-chart.js" | relative_url }}"></script>
    {% endif %}
  </body>
</html>
